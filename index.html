<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farhan Ayaz - Future CSE Engineer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #0a0a0a;
            --secondary-bg: rgba(20, 20, 40, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #00d4ff;
            --neon-cyan: #00ff88;
            --neon-purple: #8a2be2;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --gradient: linear-gradient(135deg, #0c0c2e 0%, #1a0033 50%, #0a0a0a 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--gradient);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Particles Background */
        .particles-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Loading Screen */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader.hidden { opacity: 0; pointer-events: none; }

        .loader::before {
            content: '';
            width: 50px;
            height: 50px;
            border: 3px solid var(--neon-blue);
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 5%;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--neon-blue); }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Orbitron', monospace;
            font-size: clamp(3rem, 8vw, 6rem);
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .typing-text { font-size: 1.5rem; color: var(--neon-cyan); margin-bottom: 2rem; }

        .cta-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            text-decoration: none;
            border-radius: 50px;
            transition: 0.3s;
        }

        .cta-button:hover {
            background: var(--neon-blue);
            color: var(--primary-bg);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Section Styling */
        section { padding: 100px 5%; max-width: 1400px; margin: 0 auto; }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
        }

        .skill-bar {
            width: 100%; height: 10px; background: rgba(255,255,255,0.1);
            border-radius: 5px; margin-top: 10px; overflow: hidden;
        }
        .skill-progress {
            height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-cyan));
            width: 0; transition: width 2s ease;
        }

        .fade-in { opacity: 0; transform: translateY(30px); transition: 0.8s; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        .scroll-progress {
            position: fixed; top: 0; left: 0; height: 3px;
            background: var(--neon-blue); z-index: 1001; width: 0;
        }
    </style>
</head>
<body>

    <div class="loader" id="loader"></div>
    <div class="particles-bg" id="particles-container"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">FA</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Farhan Ayaz</h1>
            <div class="typing-text" id="typingText"></div>
            <a href="#about" class="cta-button">Get Started</a>
        </div>
    </section>

    <section id="skills" class="fade-in">
        <div class="glass-card">
            <h2 style="margin-bottom: 2rem; font-family: 'Orbitron';">Technical Skills</h2>
            <div>
                <p>Python</p>
                <div class="skill-bar"><div class="skill-progress" data-width="95%"></div></div>
            </div>
            <div style="margin-top: 20px;">
                <p>JavaScript</p>
                <div class="skill-bar"><div class="skill-progress" data-width="85%"></div></div>
            </div>
        </div>
    </section>

    <script>
        // 1. Loading Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 1000);
        });

        // 2. Particle Animation
        const container = document.getElementById('particles-container');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        container.appendChild(canvas);

        let particles = [];
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(0, 212, 255, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas(); animate();

        // 3. Typing Effect
        const textArray = ["Coder", "Developer", "Future CSE Engineer", "AI Enthusiast"];
        let textIdx = 0, charIdx = 0, isDeleting = false;
        function type() {
            const current = textArray[textIdx];
            document.getElementById('typingText').textContent = isDeleting ? current.substring(0, charIdx--) : current.substring(0, charIdx++);
            if (!isDeleting && charIdx > current.length) { isDeleting = true; setTimeout(type, 2000); }
            else if (isDeleting && charIdx < 0) { isDeleting = false; textIdx = (textIdx + 1) % textArray.length; setTimeout(type, 500); }
            else setTimeout(type, isDeleting ? 50 : 100);
        }
        type();

        // 4. Scroll Effects
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById('scrollProgress').style.width = (winScroll / height) * 100 + "%";
            
            document.querySelectorAll('.fade-in').forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight * 0.8) el.classList.add('visible');
            });

            if (document.getElementById('skills').classList.contains('visible')) {
                document.querySelectorAll('.skill-progress').forEach(p => p.style.width = p.getAttribute('data-width'));
            }
        });
    </script>
</body>
</html>
